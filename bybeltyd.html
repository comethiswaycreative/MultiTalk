<style>
/* Layout: one storybook page per day — paper ground, watercolour brush labels, big readable lines for small readers */
:root{
  --paper:#FBF6EC; --card:#FFFDF8; --ink:#1E2A4A; --muted:#6E6656;
  --rose:#F4C3CF; --rose-soft:#FBE3E9; --leaf:#D6E8B2; --leaf-deep:#4F7A2E; --sun:#F2B53A; --line:#E9DFCB;
  --display:"Fraunces","Noto Serif TC",Georgia,"Times New Roman",serif;
  --body:"Andika","Noto Sans TC","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1F30; --card:#242A3F; --ink:#F4EEE1; --muted:#B5AC9A;
  --rose:#7B3F57; --rose-soft:#3A2836; --leaf:#3D5A2A; --leaf-deep:#A9D27C; --sun:#F2C15A; --line:#353C55; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1F30; --card:#242A3F; --ink:#F4EEE1; --muted:#B5AC9A;
  --rose:#7B3F57; --rose-soft:#3A2836; --leaf:#3D5A2A; --leaf-deep:#A9D27C; --sun:#F2C15A; --line:#353C55; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--leaf-deep);outline-offset:3px}
a{color:inherit}

/* brush strokes */
.brush{display:inline-block;padding:.18em .55em .26em;background:var(--rose);
  border-radius:42% 58% 46% 54% / 62% 44% 56% 38%;box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--rose) 70%,var(--ink) 6%)}
.brush.green{background:var(--leaf);box-shadow:none;border-radius:38% 62% 55% 45% / 55% 45% 55% 45%}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{border:0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:lang(zh) .verse q{quotes:"「" "」"}
:lang(zh) .story{line-height:1.7}
.stars{font-weight:700;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stars b{color:var(--ink)}

/* home */
.hello{text-align:left;display:flex;flex-direction:column;gap:6px}
.hello h1{font-size:clamp(34px,8vw,48px)}
.hello p{margin:0;color:var(--muted)}
.today{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.blob{width:96px;height:96px;display:grid;place-items:center;font-size:52px;line-height:1;
  background:radial-gradient(circle at 35% 30%,var(--leaf),transparent 70%),radial-gradient(circle at 70% 75%,var(--rose),transparent 65%);
  border-radius:55% 45% 52% 48% / 48% 55% 45% 52%}
.today .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.today h2{font-size:26px;margin:4px 0 2px}
.today .ref{color:var(--muted);font-style:italic;font-size:15px}
.go{grid-column:1/-1;border:0;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 18px;font-size:20px;font-weight:700}
.progress{display:flex;flex-direction:column;gap:8px}
.track{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--leaf-deep);border-radius:99px;transition:width .4s}
.progress small{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

/* list */
.section h2{font-size:26px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.tile .em{font-size:30px}
.tile .n{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tile .t{font-weight:700;font-size:15px;line-height:1.25}
.tile.done{background:color-mix(in srgb,var(--leaf) 40%,var(--card))}
.tile.done::after{content:"✓";position:absolute;top:10px;right:12px;font-weight:700;color:var(--leaf-deep)}
.tile.next{border-color:var(--leaf-deep);border-width:2.5px}

/* lesson */
.head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.head h1{font-size:clamp(30px,7.5vw,44px)}
.head .num{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.story{display:flex;flex-direction:column;gap:6px;font-size:21px;line-height:1.45}
.story p{margin:0}
.source{font-style:italic;color:var(--muted);font-size:16px;text-align:center;margin:0}
.verse{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.verse .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--leaf-deep);font-weight:700}
.verse q{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.3;quotes:"“" "”"}
.verse cite{font-style:normal;color:var(--muted);font-size:15px}
.do h2,.pray h2{font-size:30px;margin-bottom:6px}
.do-list{display:flex;flex-direction:column;gap:10px}
.act{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:transparent;border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px}
.act .brush{font-family:var(--display);font-weight:800;font-size:20px;justify-self:start}
.act span.txt{grid-column:1;font-size:18px}
.act .tick{grid-row:1/3;grid-column:2;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent}
.act[aria-pressed="true"]{border-style:solid;border-color:var(--leaf-deep)}
.act[aria-pressed="true"] .tick{background:var(--leaf-deep);border-color:var(--leaf-deep);color:var(--paper)}
.pray{background:var(--rose-soft);border-radius:28px 22px 30px 24px;padding:22px}
.pray p{margin:0;font-size:20px;line-height:1.5}
.nav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.nav button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:700;font-size:16px}
.nav button:disabled{opacity:.35;cursor:default}
.nav .finish{background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:18px}
.nav .finish.is-done{background:var(--leaf-deep);border-color:var(--leaf-deep)}
.guide{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center}
.ava{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 3px var(--leaf)}
.guide.cj .ava{box-shadow:0 0 0 3px var(--rose)}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.4;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;width:13px;height:13px;background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.bubble b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-deep)}
.guide.cj .bubble b{color:color-mix(in srgb,var(--rose) 45%,var(--ink))}
.hi{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:center}
.hi img{width:100%;border-radius:20px;display:block}
.hi p{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3}
.do-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.do-head img{width:84px;height:84px;object-fit:cover;border-radius:22px 18px 24px 16px;flex:none}
.do-head h2{margin:0}
.pray{display:grid;grid-template-columns:minmax(0,170px) 1fr;gap:18px;align-items:center}
.pray img{width:100%;border-radius:18px;display:block}
@media (max-width:480px){.hi,.pray{grid-template-columns:1fr}.hi img,.pray img{max-width:260px}}
.reset{align-self:center;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline}
.confirm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:15px}
.confirm button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:15px}
.burst{position:fixed;left:50%;top:40%;font-size:72px;pointer-events:none;transform:translate(-50%,-50%) scale(.4);opacity:0}
.burst.on{animation:pop 1s ease-out}
@keyframes pop{30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
@media (prefers-reduced-motion:reduce){.burst.on{animation:none}.fill{transition:none}}
@media (max-width:420px){.today{grid-template-columns:1fr;justify-items:start}.blob{width:80px;height:80px;font-size:44px}.story{font-size:19px}.nav{grid-template-columns:1fr 1fr}.nav .finish{grid-column:1/-1;grid-row:1}}
</style>

<script id="data" type="text/plain">
# O|🌍|God maak die wêreld|Genesis 1–2
- In die begin was alles donker en leeg.
- God sê: “Laat daar lig wees!” En daar is lig.
- God maak die lug, die see en die droë land.
- Hy maak die son, die maan en die sterre.
- Hy maak die visse, die voëls en al die diere.
- Laaste maak God mense. Hy sê: “Dit is baie goed!”
> In die begin het God die hemel en die aarde gemaak.|Genesis 1:1
* Die lig skyn|Maak jou hande oop en sprei jou vingers.
* Die see beweeg|Maak golwe met jou arms.
* God maak mense|Wys na jouself en dan na jou maatjies.
+ Liewe God, dankie vir U mooi wêreld. Dankie dat U my ook gemaak het!
# O|🍎|Adam en Eva in die tuin|Genesis 2–3
- Adam en Eva woon in God se mooi tuin.
- Daar is baie bome en lekker vrugte.
- God sê: “Moenie van hierdie een boom eet nie.”
- Maar hulle luister na die slang en eet die vrug.
- Adam en Eva moet die tuin verlaat.
- Tog maak God vir hulle klere en sorg Hy steeds vir hulle.
> As ons ons sondes bely, vergewe God ons.|1 Johannes 1:9
* Pluk 'n vrug|Strek hoog en pluk 'n vrug uit die boom.
* Luister mooi|Hou jou hand agter jou oor.
* Sê jammer|Druk jou hande teen jou hart en sê: “Jammer.”
+ Liewe God, help my om na U te luister. Dankie dat U my vergewe as ek jammer sê.
# O|🚢|Noag bou 'n ark|Genesis 6–7
- Die mense op aarde doen baie slegte dinge.
- Maar Noag is lief vir God en luister na Hom.
- God sê: “Bou 'n groot boot, 'n ark.”
- Noag kap en saag en timmer baie lank.
- Twee-twee kom die diere in die ark.
- Toe begin dit reën, en God hou Noag veilig.
> Noag het alles gedoen soos God vir hom gesê het.|Genesis 6:22
* Kap-kap|Maak of jy met 'n hamer slaan.
* Diere stap in|Stap soos 'n olifant, dan spring soos 'n kikker.
* Reëndruppels|Laat jou vingers van bo af na onder “reën”.
+ Liewe God, help my om te luister, al is dit moeilik. Dankie dat U my veilig hou.
# O|🌈|Die reënboog|Genesis 8–9
- Dit reën veertig dae en veertig nagte.
- Die ark dryf veilig op die water.
- Noag stuur 'n duif uit. Sy bring 'n olyfblaar terug!
- Die water sak, en almal klim uit die ark.
- Noag sê dankie vir God.
- God sit 'n reënboog in die wolke as 'n belofte.
> Ek sit my reënboog in die wolke as teken van my belofte.|Genesis 9:13
* Die duif vlieg|Klap jou arms soos vlerke.
* Die reënboog|Teken met jou arm 'n groot boog in die lug.
* Dankie sê|Vou jou hande en buig jou kop.
+ Liewe God, dankie dat U altyd U beloftes hou. Elke keer as ek 'n reënboog sien, dink ek aan U.
# O|⛺|Abraham vertrou God|Genesis 12
- Abraham woon in 'n stad saam met sy vrou Sara.
- Eendag sê God: “Trek na 'n nuwe land. Ek sal jou wys waar.”
- Abraham weet nie waarheen nie, maar hy vertrou God.
- Hy pak sy tente, skape en kamele.
- Hulle stap en stap 'n lang pad.
- God gaan saam en seën Abraham.
> Abraham het God geglo.|Genesis 15:6
* Pak jou tas|Maak of jy klere in 'n tas pak.
* Lang pad|Stap op die plek, al vinniger en vinniger.
* Ry 'n kameel|Wieg heen en weer soos op 'n kameel.
+ Liewe God, help my om U te vertrou, ook as ek nie weet wat gaan gebeur nie.
# O|✨|Sterre in die hemel|Genesis 15; 21
- Abraham en Sara is al baie oud, maar hulle het nie kinders nie.
- Een nag sê God: “Kyk op na die sterre. Tel hulle as jy kan!”
- “So baie kinders en kleinkinders sal jy hê.”
- Abraham glo God.
- Jare later kry Sara 'n babaseuntjie.
- Hulle noem hom Isak. Sara lag van blydskap!
> Niks is te moeilik vir die Here nie.|Genesis 18:14
* Tel sterre|Wys na die lug en tel tot tien.
* Wieg die baba|Wieg 'n baba in jou arms.
* Lag saam|Lag hardop saam met Sara!
+ Liewe God, dankie dat niks vir U te moeilik is nie. U hou altyd U woord.
# O|🤝|Jakob en Esau|Genesis 25; 27; 33
- Jakob en Esau is tweelingbroers.
- Esau is 'n jagter, en Jakob bly graag by die tente.
- Jakob kul sy broer en sy pa. Esau word baie kwaad.
- Jakob vlug weg en bly baie jare ver van die huis.
- Eendag gaan Jakob terug, en hy is bang.
- Maar Esau hardloop na hom en druk hom styf vas!
> Wees goed vir mekaar en vergewe mekaar.|Efesiërs 4:32
* Tweelinge|Staan rug aan rug met 'n maatjie.
* Weghardloop|Hardloop op die plek.
* 'n Groot drukkie|Gee iemand 'n drukkie.
+ Liewe God, help my om nie kwaad te bly nie. Leer my om te vergewe soos Esau.
# O|🧥|Josef se mooi kleed|Genesis 37
- Jakob het twaalf seuns. Josef is sy gunsteling.
- Jakob gee vir Josef 'n pragtige kleed met baie kleure.
- Josef droom dat sy broers voor hom buig.
- Sy broers word jaloers en kwaad.
- Hulle verkoop Josef aan handelaars wat na Egipte gaan.
- Maar God is by Josef, al is hy ver van die huis.
> Die Here was by Josef.|Genesis 39:2
* Trek die kleed aan|Trek jou mooi kleed aan en draai in die rondte.
* Tel die broers|Tel tot twaalf op jou vingers.
* Ek is nie alleen nie|Druk jouself styf vas.
+ Liewe God, dankie dat U altyd by my is, ook as ek alleen of hartseer voel.
# O|🌾|Josef in Egipte|Genesis 39–41
- In Egipte werk Josef hard en eerlik.
- Mense lieg oor hom, en hy beland in die tronk.
- Selfs in die tronk help God vir Josef.
- Die koning, Farao, droom van sewe vet en sewe maer koeie.
- God help Josef om die droom te verstaan: daar kom 'n hongersnood.
- Farao maak Josef die tweede belangrikste man in Egipte!
> God laat alles ten goede meewerk vir dié wat Hom liefhet.|Romeine 8:28
* Hard werk|Maak of jy swaar sakke koring dra.
* Slaap en droom|Lê jou kop op jou hande en snork.
* Koeie|Loei soos 'n koei: Moe-oe!
+ Liewe God, help my om eerlik en hardwerkend te wees, ook as dinge moeilik is.
# O|🫂|Josef vergewe sy broers|Genesis 42–45
- Daar is geen kos in die land waar Josef se familie woon nie.
- Sy broers kom na Egipte om kos te koop.
- Hulle herken Josef nie, maar hy herken hulle.
- Josef huil en sê: “Ek is Josef, julle broer!”
- Die broers is bang, maar Josef vergewe hulle.
- “God het alles ten goede gebruik,” sê Josef.
> Vergewe mekaar soos die Here julle vergewe het.|Kolossense 3:13
* Kos dra|Maak of jy 'n swaar sak op jou rug dra.
* Wie is ek?|Bedek jou gesig en wys dit dan: “Dis ek!”
* Vergewe|Skud iemand se hand en glimlag.
+ Liewe God, help my om ander te vergewe soos U my vergewe.
# O|🧺|Baba Moses in die mandjie|Eksodus 2
- In Egipte is die koning gemeen met God se volk.
- 'n Mamma wil haar babaseuntjie veilig hou.
- Sy sit hom in 'n mandjie tussen die riete van die rivier.
- Sy suster Mirjam hou die mandjie dop.
- 'n Prinses kry die baba en is lief vir hom.
- Sy noem hom Moses, en God hou hom veilig.
> Die Here sal jou beskerm.|Psalm 121:7
* Wieg die mandjie|Wieg jou arms soos 'n mandjie op die water.
* Loer-loer|Maak 'n verkyker met jou hande en loer.
* Riete in die wind|Staan regop en swaai stadig heen en weer.
+ Liewe God, dankie dat U kinders veilig hou. Pas my familie op.
# O|🔥|Die brandende bos|Eksodus 3–4
- Moses is groot en pas skape op in die woestyn.
- Hy sien 'n bos wat brand, maar dit brand nie op nie!
- God roep: “Moses! Trek jou skoene uit, die grond is heilig.”
- God sê: “Gaan na Farao en lei my volk uit Egipte.”
- Moses is bang. “Ek kan nie goed praat nie.”
- God sê: “Ek sal by jou wees.”
> Ek sal by jou wees.|Eksodus 3:12
* Vlammetjies|Wikkel jou vingers hoog in die lug soos vlamme.
* Skoene uit|Maak of jy jou skoene uittrek.
* Hier is ek|Steek jou hand op en sê: “Hier is ek!”
+ Liewe God, as ek bang is, help my onthou dat U by my is.
# O|🐸|Laat my volk gaan|Eksodus 7–12
- Moses en Aäron gaan na Farao.
- “Laat God se volk gaan!” sê hulle. Maar Farao sê: “Nee!”
- God stuur paddas, muskiete, hael en ander plae.
- Elke keer sê Farao weer: “Nee!”
- Ná die tiende plaag laat Farao die volk eindelik gaan.
- God se volk trek uit Egipte, vry en bly!
> Die Here is my krag en my lied.|Eksodus 15:2
* Paddas spring|Hurk en spring soos 'n padda.
* Hael val|Tik vinnig met jou vingers op jou bene.
* Vry!|Spring hoog op en juig!
+ Liewe God, dankie dat U sterk is en U kinders red.
# O|🌊|Deur die Rooi See|Eksodus 14
- God se volk kom by die Rooi See.
- Agter hulle kom Farao se soldate met strydwaens.
- Die mense is baie bang.
- Moses steek sy staf uit oor die water.
- God stuur 'n sterk wind, en die see gaan oop!
- Die volk stap op droë grond tot anderkant.
> Die Here sal vir julle veg. Julle moet net stil wees.|Eksodus 14:14
* Steek die staf uit|Steek jou arm voor jou uit.
* Die see gaan oop|Sit jou hande saam en skuif hulle ver uitmekaar.
* Droë voete|Stap op jou tone tussen die mure water deur.
+ Liewe God, U is so sterk! Help my om U te vertrou as ek bang is.
# O|🍞|Manna uit die hemel|Eksodus 16
- In die woestyn is daar nie kos nie. Die mense kla.
- God sê: “Ek sal vir julle brood uit die hemel gee.”
- Elke oggend lê daar wit vlokkies op die grond. Dit heet manna.
- Dit smaak soos koekies met heuning.
- Elke dag gee God net genoeg.

- 天使說：「祂不在這裡，祂已經復活了！」

# 掃羅看見大光|使徒行傳 9
- 掃羅很討厭相信耶穌的人。
- 他到大馬色去，要抓那些人。
- 在路上，有一道強光從天上照下來。

- 掃羅後來叫保羅，到處傳講耶穌。

+ 親愛的耶穌，謝謝祢能改變人。求祢讓我的心煥然一新。
# 保羅和西拉唱歌|使徒行傳 16:16–34
- 保羅和西拉傳講耶穌，結果被關進監牢。
- 他們的腳被鎖起來。

# 一切都更新了|啟示錄 21
- 約翰看見了天堂的異象。
- 他看見一個新天新地。

- 神說：「看哪，我將一切都更新了！」

<script>
function parse(id,base){
  const out=[];
  document.getElementById(id).textContent.split('\n').forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    const k=l[0], v=l.slice(2);
    if(k==='#'){const p=v.split('|');
      if(base){const b=base[out.length]||{};out.push({t:b.t,e:b.e,n:p[0],r:p[1],s:[],d:[],v:null,p:''})}
      else out.push({t:p[0],e:p[1],n:p[2],r:p[3],s:[],d:[],v:null,p:''});
      return}
    const cur=out[out.length-1]; if(!cur) return;
    if(k==='-') cur.s.push(v);
    else if(k==='>'){const [a,b]=v.split('|');cur.v={text:a,ref:b}}
    else if(k==='*'){const [a,b]=v.split('|');cur.d.push({title:a,text:b})}
    else if(k==='+') cur.p=v;
  });
  return out;
}

function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const app=document.getElementById('app');
const nextIdx=()=>{for(let i=1;i<=TOTAL;i++) if(!done.has(i)) return i; return null};

function setLang(l){
  lang=l; LESSONS=DATA[l]; S=STR[l];
  document.documentElement.lang=HTML_LANG[l];
  try{localStorage.setItem('ons-bybeltyd-taal',l)}catch(e){}
  route(true);
}

function bar(back){
  return `<div class="bar">${back?`<a class="chip" href="${back.href}">← ${back.label}</a>`:'<span></span>'}
  <div class="right"><div class="lang" role="group" aria-label="Language">${
    LANGS.map(([k,l])=>`<button data-lang="${k}" aria-pressed="${k===lang}" lang="${HTML_LANG[k]}">${l}</button>`).join('')
  }</div><span class="stars">⭐ <b>${done.size}</b> / ${TOTAL}</span></div></div>`;
}

function home(){
  const n=nextIdx(); const pct=Math.round(done.size/TOTAL*100);
  let today;
  if(n){const L=LESSONS[n-1];
    today=`<section class="today" aria-label="${S.todayAria}">
      <div class="blob" aria-hidden="true">${L.e}</div>
      <div><div class="lbl">${S.today(n)}</div><h2>${esc(L.n)}</h2><div class="ref">${esc(L.r)}</div></div>
      <button class="go" data-go="${n}">${S.go}</button></section>`;
  } else {
    today=`<section class="today"><div class="blob" aria-hidden="true">🏆</div>
      <div><div class="lbl">${S.congrats}</div><h2>${S.alldone(TOTAL)}</h2></div>
      <button class="go" data-go="1">${S.again}</button></section>`;
  }
  app.innerHTML=`${bar()}
  <header class="hello"><h1><span class="brush">${S.name}</span></h1><p>${S.tag}</p></header>
  <div class="hi"><img src="${IMG.pair}" alt="MD & CJ"><p>${HI[lang].hi}</p></div>
  ${today}
  <div class="progress"><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${done.size}"><div class="fill" style="width:${pct}%"></div></div>
  <small>${S.prog(done.size,TOTAL)}</small></div>
  ${listHTML(n)}
  <div id="resetBox" class="confirm"><button class="reset" id="reset">${S.reset}</button></div>`;
}

function listHTML(n){
  const sec=(t,label)=>`<section class="section"><h2>${label}</h2><div class="grid">${
    LESSONS.map((L,i)=>L.t!==t?'':`<button class="tile${done.has(i+1)?' done':''}${n===i+1?' next':''}" data-go="${i+1}">
      <span class="em" aria-hidden="true">${L.e}</span><span class="n">${S.tile(i+1)}</span><span class="t">${esc(L.n)}</span></button>`).join('')
  }</div></section>`;
  return sec('O',S.OT)+sec('N',S.NT);
}

function lesson(i){
  const L=LESSONS[i-1]; if(!L) return home();
  const G=GUIDE[lang][i-1]||['',''];
  const isDone=done.has(i);
  app.innerHTML=`${bar({href:'#tuis',label:S.all})}
  <header class="head"><div class="blob" aria-hidden="true">${L.e}</div>
    <span class="num">${S.num(i,TOTAL,L.t==='O'?S.OT:S.NT)}</span>
    <h1><span class="brush">${esc(L.n)}</span></h1></header>
  <div class="guide md"><img class="ava" src="${IMG.cj}" alt="" data-who="md"><div class="bubble"><b>MD</b>${esc(G[0])}</div></div>
  <div class="story">${L.s.map(x=>`<p>${esc(x)}</p>`).join('')}</div>
  <p class="source">${esc(S.from(L.r))}</p>
  <div class="guide cj"><img class="ava" src="${IMG.md}" alt="" data-who="cj"><div class="bubble"><b>${HI[lang].ask}</b>${esc(G[1])}</div></div>
  <section class="verse" aria-label="${S.verse}"><span class="lbl">${S.verse}</span><q>${esc(L.v.text)}</q><cite>${esc(L.v.ref)}</cite></section>
  <section class="do"><div class="do-head"><img src="${IMG.up}" alt=""><h2>${S.doit}</h2></div><div class="do-list">${
    L.d.map((a,j)=>`<button class="act" aria-pressed="false" id="act-${i}-${j}"><span class="brush green">${esc(a.title)}</span><span class="txt">${esc(a.text)}</span><span class="tick" aria-hidden="true">✓</span></button>`).join('')
  }</div></section>
  <section class="pray"><img src="${IMG.pray}" alt="MD & CJ"><div><h2>${S.pray}</h2><p>${esc(L.p)}<br>${S.amen}</p></div></section>
  <nav class="nav">
    <button data-go="${i-1}" ${i<=1?'disabled':''}>${S.prev}</button>
    <button class="finish${isDone?' is-done':''}" id="finish">${isDone?S.finDone:S.fin}</button>
    <button data-go="${i+1}" ${i>=TOTAL?'disabled':''}>${S.next}</button>
  </nav>`;
}

function route(keepScroll){
  const m=location.hash.slice(1).match(/^storie-(\d+)$/);
  if(m) lesson(+m[1]); else home();
  if(keepScroll!==true) window.scrollTo(0,0);
}

app.addEventListener('click',e=>{
  const lb=e.target.closest('[data-lang]');
  if(lb){setLang(lb.dataset.lang);return}
  const go=e.target.closest('[data-go]');
  if(go&&!go.disabled){location.hash='storie-'+go.dataset.go;return}
  const act=e.target.closest('.act');
  if(act){act.setAttribute('aria-pressed',act.getAttribute('aria-pressed')==='true'?'false':'true');return}
  if(e.target.closest('#finish')){
    const i=+location.hash.match(/\d+/)[0];
    const b=document.getElementById('finish');
    if(done.has(i)){done.delete(i);b.classList.remove('is-done');b.textContent=S.fin}
    else{done.add(i);b.classList.add('is-done');b.textContent=S.finDone;
      const s=document.getElementById('burst');s.classList.remove('on');void s.offsetWidth;s.classList.add('on')}
    save(); document.querySelector('.stars b').textContent=done.size; return;
  }
  if(e.target.closest('#reset')){
    document.getElementById('resetBox').innerHTML=`<span>${S.resetQ}</span><button id="resetYes">${S.yes}</button><button id="resetNo">${S.no}</button>`;return}
  if(e.target.closest('#resetYes')){done.clear();save();home();return}
  if(e.target.closest('#resetNo')){home();return}
});
window.addEventListener('hashchange',()=>route());
document.documentElement.lang=HTML_LANG[lang];
route();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
